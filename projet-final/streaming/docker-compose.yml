services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: retail-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    volumes:
      - retail-kafka-data:/var/lib/kafka/data
    networks:
      - retail-streaming

  postgres:
    image: postgres:16-alpine
    container_name: retail-postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=retail
      - POSTGRES_PASSWORD=retail
      - POSTGRES_DB=retail
    volumes:
      - retail-postgres-data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - retail-streaming

  grafana:
    image: grafana/grafana:11.2.0
    container_name: retail-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - retail-grafana-data:/var/lib/grafana
    depends_on:
      - postgres
    networks:
      - retail-streaming

networks:
  retail-streaming:
    driver: bridge

volumes:
  retail-kafka-data:
  retail-postgres-data:
  retail-grafana-data:
